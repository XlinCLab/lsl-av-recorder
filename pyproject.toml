[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsl-av-recorder"
version = "0.4.0"
description = "Cross-platform LSL + Multi-USB-Video recorder with LabRecorder XDF output (RCS) and Qt previews; audio streamed via LSL (no WAV)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pylsl>=1.16.2",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "sounddevice>=0.4.6",
  "PyQt6>=6.5",
  "pygrabber>=0.2; sys_platform == 'win32'",
  "comtypes>=1.2; sys_platform == 'win32'",
  "pyxdf>=1.17.5",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "pyxdf>=1.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["recorder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
